<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
.container{
	margin-top: 50px
}
.row{
	width: 350px;
	margin: 0px auto
}
</style>
</head>
<body>
	<div class="container">
		<div class="row">
			<h3 class="text-center">메인 페이지</h3>
			<table class="table">
				<tbody>
					<tr sec:authorize="isAnonymous()">
						<td class="text-center">
							<a href="/login" class="btn btn-sm btn-primary">로그인</a>
						</td>
						<td class="text-center">
							<a href="#" class="btn btn-sm btn-success">회원가입</a>
						</td>
					</tr>
					<tr sec:authorize="isAuthenticated()">
						<td class="text-center" colspan="2">
							<strong sec:authentication="name"></strong>&nbsp;환영합니다
						</td>
					</tr>
					<tr sec:authorize="hasRole('USER')">
						<td class="text-center" colspan="2">
							<a href="/user" class="btn btn-sm btn-info">마이페이지</a>
						</td>
					</tr>
					<tr sec:authorize="hasRole('ADMIN')">
						<td class="text-center" colspan="2">
							<a href="/admin" class="btn btn-sm btn-info">관리자페이지</a>
						</td>
					</tr>
					<tr sec:authorize="isAuthenticated()">
						<td class="text-center" colspan="2">
							<form method="post" action="/logout">
								<button type="submit" class="btn btn-sm btn-danger">로그아웃</button>
							</form>
						</td>
					</tr>
					<tr>
						<td class="text-center" colspan="2">
							<a href="/all" class="btn btn-sm btn-warning">모든 사용자</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
