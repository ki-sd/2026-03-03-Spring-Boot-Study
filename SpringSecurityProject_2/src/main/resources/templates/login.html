<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
.container{
	margin-top: 50px
}
.row{
	width: 350px;
	margin: 0px auto
}
</style>
</head>
<body>
	<div class="container">
		<div class="row">
			<h3 class="text-center">Login</h3>
			<form method="post" action="/login_process">
				<table class="table">
					<tbody>
						<tr>
							<td width="20%">ID</td>
							<td width="80%">
								<input type="text" name="username" class="input-sm" size="20">
							</td>
						</tr>
						<tr>
							<td width="20%">PW</td>
							<td width="80%">
								<input type="password" name="password" class="input-sm" size="20">
							</td>
						</tr>
						<tr class="text-center">
							<td colspan="2">
								<button type="submit" class="btn-sm btn-primary">로그인</button>
								<button type="button" class="btn-sm btn-warning" onclick="location.href='/'">취소</button>
							</td>
						</tr>
					</tbody>
				</table>
			</form>
			<span class="text-center">
				<p style="color:red" th:if="${param.error!=null}">[[${session.loginError}]]</p>
			</span>
		</div>
	</div>
</body>
</html>
