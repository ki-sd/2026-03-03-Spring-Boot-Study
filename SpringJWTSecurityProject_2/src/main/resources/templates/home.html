<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
.container{
	margin-top: 50px
}
.row{
	width: 350px;
	margin: 0px auto
}
</style>
</head>
<body>
	<div class="container">
		<div class="row">
			<h3 class="text-center">Home</h3>
			<table class="table">
				<tbody>
				<!-- 
						<sec:authorize access="isAuthenticated()">
				 -->
					<tr sec:authorize="isAuthenticated()">
						<td class="text-center">
						<!-- 
							<span sec:authentication="principal.username"></span>
							<span sec:authentication="name"></span>
							
							<li sec:authorize="hasRole('ADMIN')">
								관리자
							</li>
							<li sec:authorize="hasRole('USER')">
								사용자
							</li>
							<li sec:authorize="isAuthenticated()">
								마이페이지
							</li>
							<li sec:authorize="isAnonymous()">
								로그인
							</li>
						 -->
							로그인 사용자: <span sec:authentication="principal.username"></span>
						</td>
					</tr>
					<!-- Admin인 경우 -->
					<tr sec:authorize="hasRole('ADMIN')">
						<td class="text-center">
							<a href="/admin" class="btn btn-sm btn-primary">관리자 페이지</a>
						</td>
					</tr>
					<!-- User인 경우 -->
					<tr sec:authorize="isAuthenticated()">
						<td class="text-center">
							<a href="/user" class="btn btn-sm btn-info">사용자 페이지</a>
						</td>
					</tr>
					<tr sec:authorize="isAuthenticated()">
						<td class="text-center">
							<form method="post" action="/logout">
								<button type="submit" class="btn btn-sm btn-warning">로그아웃</button>
							</form>
						</td>
					</tr>
					<tr sec:authorize="isAnonymous()">
						<td class="text-center">
							<a href="/login" class="btn btn-sm btn-success">로그인</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
